# Optional: This workflow can be deleted if using branch deploy with /docs
# The simplest setup: Settings → Pages → Source: Deploy from branch → main /docs
name: (Opcional) Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - run: |
          mkdir _site && cp -r docs/* _site/
          curl -sL https://cdn.socket.io/4.7.5/socket.io.min.js -o _site/socket.io.min.js
      - run: sed -i 's|<script src="/app.js"></script>|<script src="socket.io.min.js"></script>\n<script src="app.js"></script>|' _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4