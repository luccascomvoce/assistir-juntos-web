name: Deploy Backend + Update Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ── Build & Deploy Backend (Self-Hosted Runner on your machine) ──
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose Deploy
        run: |
          docker-compose down --remove-orphans
          docker-compose up -d --build

      - name: Wait for tunnel
        run: sleep 15

      - name: Extract tunnel URL
        id: tunnel
        run: |
          URL=$(docker logs assistir-juntos-tunnel 2>&1 | grep -oP 'https://[a-z0-9.-]+\.trycloudflare\.com' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Tunnel URL: $URL"

      - name: Update frontend config
        run: |
          echo "{\"url\":\"${{ steps.tunnel.outputs.url }}\"}" > frontend/tunnel-url.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tunnel-url.json
          git diff --staged --quiet || git commit -m "🤖 update tunnel url [${{ github.run_number }}]"
          git push

  # ── Deploy Frontend to GitHub Pages ──
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy frontend files
        run: |
          mkdir _site
          cp -r frontend/* _site/
          # Also copy socket.io client for standalone use
          curl -sL https://cdn.socket.io/4.7.5/socket.io.min.js -o _site/socket.io.min.js

      - name: Fix socket.io import in index.html
        run: |
          sed -i 's|<script src="/app.js"></script>|<script src="socket.io.min.js"></script>\n<script src="app.js"></script>|' _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4