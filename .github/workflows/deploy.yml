name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose Deploy
        shell: pwsh
        run: |
          docker-compose down --remove-orphans 2>$null
          docker-compose up -d --build
          Start-Sleep -Seconds 15

      - name: Extract tunnel URL
        id: tunnel
        shell: pwsh
        run: |
          $logs = docker logs assistir-juntos-tunnel 2>&1 | Out-String
          $url = [regex]::Match($logs, 'https://[a-z0-9.-]+\.trycloudflare\.com').Value
          if (-not $url) { Write-Error "Tunnel URL not found"; exit 1 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "url=$url"
          Write-Host "Tunnel URL: $url"

      - name: Update frontend config
        shell: pwsh
        run: |
          $url = '${{ steps.tunnel.outputs.url }}'
          @{ url = $url } | ConvertTo-Json -Compress | Set-Content -Path frontend/tunnel-url.json
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add frontend/tunnel-url.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "update tunnel url [${{ github.run_number }}]"
            git push
          } else {
            Write-Host "No changes to commit"
          }

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy frontend files
        run: |
          mkdir _site
          cp -r frontend/* _site/
          curl -sL https://cdn.socket.io/4.7.5/socket.io.min.js -o _site/socket.io.min.js

      - name: Fix HTML imports
        run: |
          sed -i 's|<script src="/app.js"></script>|<script src="socket.io.min.js"></script>\n<script src="app.js"></script>|' _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4