# Coturn TURN server configuration
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# Listening port
listening-port=3478

# External IP (Cloudflare Tunnel will proxy this)
external-ip=__EXTERNAL_IP_AUTO__

# Authentication: use long-term credentials
lt-cred-mech
realm=assistir-juntos

# Users: username:password (generate with: turnadmin -a -u user -r assistir-juntos -p password)
# You can define multiple users separated by commas
user=assistir:junt0s-w3brtc

# Bind to all interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Disable TLS/DTLS for now (Cloudflare Tunnel handles TLS)
no-tls
no-dtls

# Performance
min-port=49152
max-port=65535

# Logging
verbose
log-file=stdout

# Allow only TURN (no STUN-only, but STUN is still available)
# This prevents abuse of free relay bandwidth
no-cli

# Rate limiting
max-bps=2000000

# Fingerprint for WebRTC compatibility
fingerprint

# Enable TCP relay (needed for mobile networks and Cloudflare Tunnel which only forwards TCP)
# Cloudflare Tunnel only forwards TCP, so TURN over TCP is essential for mobile WebRTC connectivity
